name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:   # reused as the gate by release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The staged core resolves from the private `staging` index; uv applies these to it by name.
env:
  UV_INDEX_STAGING_USERNAME: ${{ secrets.CLOUDREPO_READ_USERNAME || secrets.CLOUDREPO_USERNAME }}
  UV_INDEX_STAGING_PASSWORD: ${{ secrets.CLOUDREPO_READ_PASSWORD || secrets.CLOUDREPO_PASSWORD }}

jobs:
  lint-type-test:
    name: ruff · mypy · pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range, floor to ceiling (requires-python). Lint and types run once, on the floor.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }} --dev --locked

      - name: Ruff lint
        if: matrix.python == '3.11'
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Ruff format check
        if: matrix.python == '3.11'
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: mypy (strict)
        if: matrix.python == '3.11'
        run: uv run --python ${{ matrix.python }} mypy src/

      - name: pytest
        run: uv run --python ${{ matrix.python }} pytest -q

      - name: Minimize uv cache
        run: uv cache prune --ci
