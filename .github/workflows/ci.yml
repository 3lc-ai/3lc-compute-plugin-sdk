name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:   # reused as the gate by release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The staged core resolves from the private `staging` index; uv applies these to it by name.
env:
  UV_INDEX_STAGING_USERNAME: ${{ secrets.CLOUDREPO_READ_USERNAME || secrets.CLOUDREPO_USERNAME }}
  UV_INDEX_STAGING_PASSWORD: ${{ secrets.CLOUDREPO_READ_PASSWORD || secrets.CLOUDREPO_PASSWORD }}

jobs:
  browser-layout:
    name: Plugin frame layout (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
      - name: Install browser test environment
        run: |
          uv venv --python 3.12
          uv pip install --no-deps .
          uv pip install pytest playwright==1.64.1
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Frame layout regression tests
        run: .venv/bin/python -m pytest tests/test_frame_layout_browser.py -q

  lint-type-test:
    name: ruff · mypy · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --python 3.12 --dev --locked

      - name: Ruff lint
        run: uv run --python 3.12 ruff check .

      - name: Ruff format check
        run: uv run --python 3.12 ruff format --check .

      - name: mypy (strict)
        run: uv run --python 3.12 mypy src/

      - name: pytest
        run: uv run --python 3.12 pytest -q

      - name: Minimize uv cache
        run: uv cache prune --ci
