name: Release

# Tag (`v*`) pushes publish to public PyPI via Trusted Publishing (GitHub OIDC, no secrets).
# To cut a release: bump `version` in pyproject.toml (regenerate uv.lock), update CHANGELOG.md,
# commit, then push a tag `vX.Y.Z` that matches the version.
#
# Manual runs build POC wheels for the private staging index (CloudRepo `prereleases`).
# Build-only is the default; publishing is an explicit input. Build stamps never reach PyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build to the private staging index
        type: boolean
        default: false

jobs:
  # Gate the release on the full CI suite (ruff · mypy · pytest).
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Tag (`v*`) pushes → the real release, to public PyPI.
  publish-pypi:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release (step below)
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Verify tag matches pyproject version
        run: |
          PKG=$(uv version --frozen --output-format json | jq -r '.version')
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$PKG tag=$TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag $GITHUB_REF_NAME ($TAG) != pyproject version $PKG"; exit 1; }

      # --no-sources strips [tool.uv.sources] so the released wheel never bakes in a dev
      # index/path override (the published artifact resolves deps from PyPI).
      - name: Build
        run: uv build --no-sources

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      # Publish the tagged version's changelog section as a GitHub Release (curated notes,
      # not GitHub's commit list). The Release stays editable after publish for touch-up.
      - name: Extract changelog section
        id: changelog
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ && f {exit} f' \
            CHANGELOG.md > notes.md
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          { echo "notes<<EOF"; cat notes.md; echo EOF; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ## Installation
            ```bash
            pip install 3lc-compute-plugin-sdk==${{ steps.changelog.outputs.ver }}
            ```
          draft: false
          generate_release_notes: false

  # Manual runs exercise the same build whether or not publishing is requested.
  publish-cloudrepo-prerelease:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: release
    env:
      UV_PUBLISH_URL: https://pypi.3lc.ai/repositories/prereleases
      UV_PUBLISH_USERNAME: ${{ secrets.STAGING_INDEX_PUBLISH_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.STAGING_INDEX_PUBLISH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Verify the 'release' environment is configured
        if: inputs.publish
        run: |
          : "${UV_PUBLISH_USERNAME:?set the STAGING_INDEX_PUBLISH_USERNAME secret on the 'release' environment}"
          : "${UV_PUBLISH_PASSWORD:?set the STAGING_INDEX_PUBLISH_PASSWORD secret on the 'release' environment}"

      # The UTC stamp sorts after existing timestamped POC builds. Run + attempt distinguish
      # concurrent builds and reruns, while numeric segments satisfy ordinary SDK ranges.
      - name: Stamp build-numbered version
        run: |
          BASE=$(uv version --frozen --output-format json | jq -r '.version')
          STAGED_VERSION="${BASE}.$(date -u +%Y%m%d%H%M%S).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          uv version --frozen "$STAGED_VERSION"
          echo "staged build version: $STAGED_VERSION"

      - name: Build
        run: uv build --no-sources

      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-poc-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error

      - name: Publish to the staging index
        if: inputs.publish
        run: uv publish
