[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3lc-compute-plugin-sdk"
# The plugin-contract (ABI) version. This IS tlc_plugin_sdk.SDK_CONTRACT_VERSION
# (read back via importlib.metadata) — one source of truth. SemVer MAJOR.MINOR.PATCH;
# the 0.x line is additive-only (see README → Status).
version = "0.3.2"
description = "Public Python SDK for building 3LC compute-service plugins."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "3LC", email = "support@3lc.ai" }]
# Apache-2.0: the SDK is the public plugin contract, intended to go open-source. `{ text }`
# keeps the metadata at the pinned core-metadata 2.1 (the SPDX string form would force 2.4);
# the OSI classifier below carries the machine-readable signal. Full text in ./LICENSE.
license = { text = "Apache-2.0" }
keywords = ["3lc", "plugin", "sdk", "machine-learning", "data-curation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# The SDK is the ROOT of the plugin dependency graph: it depends on the ASGI server the worker
# runs on (uvicorn), the route framework a plugin authors against (litestar), and the 3LC data
# plane (3lc) that `tlc_plugin_sdk.shared.*` and every real plugin build on. It must NEVER depend
# back on the host (3lc-compute) or on any plugin. A plugin venv installs THIS, not the full service.
#
# All three are imported LAZILY — `import tlc_plugin_sdk` stays cheap (tests/test_import_light.py):
# the server stack loads only when a worker actually serves, `tlc` only when a `shared.*` helper
# runs. `3lc` is a base dep, not an extra, on purpose: a plugin that installs the SDK gets the data
# plane and the shared helpers unconditionally, so there is no way to end up with a venv that
# imports fine and then fails on first use. Light consumers that only want the contract core
# (the .d.ts, SDK_CONTRACT_VERSION) pay the install weight; none of them ship it.
dependencies = [
    "uvicorn>=0.34.0",
    "litestar>=2.22.0,<3.0.0",
    "3lc[pandas]>=3.0.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/3lc-ai/3lc-compute-plugin-sdk"
Repository = "https://github.com/3lc-ai/3lc-compute-plugin-sdk"

[project.optional-dependencies]
# DEPRECATED no-op. `3lc` used to be behind this extra (`3lc-compute-plugin-sdk[shared]`, 0.1–0.3.0);
# it is a base dependency now. The empty alias keeps existing `[shared]` pins resolving without a
# warning until the fleet drops the suffix. Removed at 1.0.
shared = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.14",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tlc_plugin_sdk"]
core-metadata-version = "2.1"
# Ship non-Python package data in the wheel. ``py.typed`` marks the package typed;
# ``contract/*.d.ts`` is the JS_CONTRACT browser-surface declaration a plugin's
# ``ui.html`` references (lands at ``<site-packages>/tlc_plugin_sdk/contract/plugin-api.d.ts``).
# Hatchling includes package files by default, but declare these explicitly so a future
# include/exclude narrowing can't silently drop the contract assets.
artifacts = [
    "src/tlc_plugin_sdk/py.typed",
    "src/tlc_plugin_sdk/contract/*.d.ts",
]

[tool.hatch.build.targets.wheel.force-include]
"src/tlc_plugin_sdk/contract/plugin-api.d.ts" = "tlc_plugin_sdk/contract/plugin-api.d.ts"

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'", "sys_platform == 'win32'"]

# 3lc resolves from public PyPI — its home since the 3.2 rust release — so no index pin is
# needed (same as the host, 3lc-compute, and 3lc-examples). LOCAL DEV: for an unreleased 3lc,
# override UNCOMMITTED via [tool.uv.sources] with an editable path source to your 3lc checkout.

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["A", "C4", "E", "EM", "F", "I", "N", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["N806", "N818", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Untyped boundary. `tlc` (and its `tlcurl`) is installed in the CI env but ships no `py.typed`,
# so mypy treats it as Any; torch is not an SDK dep at all (an ML extra a plugin venv brings) —
# the shared model-storage helper references it lazily.
[[tool.mypy.overrides]]
module = [
    "tlc",
    "tlc.*",
    "tlcurl.*",
    "torch",
]
ignore_missing_imports = true
